name: Autonomous Freshness & IndexNow Engine

on:
  schedule:
    # Runs every 72 hours at 04:00 UTC
    - cron: '0 4 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install --package-lock-only && npm ci

      - name: Run verification, rotation & IndexNow ping
        env:
          SITE_URL: https://aitopindex.com
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/auto-update.mjs

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "bot@aitopindex.com"
          git config --local user.name "AITopIndex Freshness Bot"
          if [[ -n $(git status -s src/data/agencies.json src/data/reserve.json src/data/link-health.json) ]]; then
            git add src/data/agencies.json src/data/reserve.json src/data/link-health.json
            git commit -m "chore(freshness): auto-verify links, rotate reserve agencies & update timestamps [skip ci]"
            git push
          else
            echo "No changes in agency database."
          fi
